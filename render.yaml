# Despliegue continuo en Render (capa gratuita).
# Cada cambio que llega a main se despliega automáticamente en la URL pública.
services:
  - type: web
    name: la-grada-colchonera
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render genera un valor aleatorio y lo guarda como secreto (no está en el repositorio)
      - key: SESSION_SECRET
        generateValue: true
      # URL de la base de datos de Neon: se introduce a mano en el panel de Render (es un secreto)
      - key: DATABASE_URL
        sync: false
