# Despliegue continuo en Render (capa gratuita).
# Cada cambio que llega a main se despliega automáticamente en la URL pública.
services:
  - type: web
    name: la-grada-colchonera
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
