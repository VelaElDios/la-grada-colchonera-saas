# Integración continua: ejecuta las pruebas automáticas en cada pull request
# y en cada cambio que llega a main o a una rama de hito.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'hito-*/integracion'

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest

    # PostgreSQL real para probar el repositorio de base de datos (en local se usa pg-mem)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grada
          POSTGRES_PASSWORD: grada
          POSTGRES_DB: grada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://grada:grada@localhost:5432/grada_test

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t la-grada-colchonera:ci .

      - name: Arrancar el contenedor y comprobar /api/health
        run: |
          docker run -d --name grada -p 8080:8080 -e NODE_ENV=development la-grada-colchonera:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs grada
          exit 1
